name: Build RoboPi Firmware Deb Package

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Tag vs changelog version check
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        DEBIAN_VERSION=$(dpkg-parsechangelog -S Version)
        CHANGELOG_VERSION=${DEBIAN_VERSION%%-*}

        echo "Tag version:       $TAG_VERSION"
        echo "Changelog version: $CHANGELOG_VERSION"

        if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
          echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
          exit 1
        fi

        echo "Tag matches changelog: v$TAG_VERSION"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential debhelper

    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b -a arm64

        DEBIAN_VERSION=$(dpkg-parsechangelog -S Version)
        VERSION=${DEBIAN_VERSION%%-*}
        mv "../robopi-firmware_${DEBIAN_VERSION}_arm64.deb" .

        echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
        ls -l robopi-firmware_*_arm64.deb

    - name: Verify package contents
      run: |
        set -eu
        deb=$(find . -maxdepth 1 -name 'robopi-firmware_*_arm64.deb' -print -quit)
        test -n "$deb"
        test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
        for fw in \
          lib/firmware/mediatek/WIFI_MT7922_patch_mcu_1_1_hdr.bin \
          lib/firmware/mediatek/WIFI_RAM_CODE_MT7922_1.bin \
          lib/firmware/mediatek/BT_RAM_CODE_MT7922_1_1_hdr.bin \
          lib/firmware/mediatek/mt7663pr2h.bin \
          lib/firmware/mediatek/mt7668pr2h.bin; do
          dpkg-deb -c "$deb" | grep -q "$fw"
        done

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: robopi-firmware-v${{ env.PKG_VERSION }}-arm64
        path: |
          robopi-firmware_*_arm64.deb

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          robopi-firmware_*_arm64.deb
